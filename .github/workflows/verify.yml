name: Website checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch retained decision history
        shell: bash
        run: |
          # Forks may not carry the upstream tags required by test:history-archive.
          git fetch --no-tags https://github.com/dinkuskit/dinkuskit.git \
            refs/tags/archive/pr-100-pre-cleanup-20261027:refs/tags/archive/pr-100-pre-cleanup-20261027 \
            refs/tags/archive/pr-100-history-package-20261027:refs/tags/archive/pr-100-history-package-20261027
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
